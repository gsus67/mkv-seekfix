[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkv-seekfix"
version = "0.1.0"
description = "Arregla MKV que no permiten adelantar/atrasar en algunas TV (indice de saltos al frente, sin recodificar)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mkv-seekfix = "mkv_seekfix.cli:main"

[tool.setuptools]
packages = ["mkv_seekfix"]

[tool.setuptools.package-data]
mkv_seekfix = ["web_ui.html"]
